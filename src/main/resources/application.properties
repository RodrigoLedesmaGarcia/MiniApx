spring.application.name=MiniApx
server.port=8080

# Docker Compose del proyecto: localhost:3307. Para MySQL local cambia DB_URL al puerto 3306.
spring.datasource.url=jdbc:mysql://localhost:3306/apx_practica
spring.datasource.username=root
spring.datasource.password=12345

# Solo para desarrollo local: Hibernate crea/actualiza la tabla a partir de @Entity.
# En producción: migraciones (Flyway o Liquibase) y ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
